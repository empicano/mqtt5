[package]
name = "mqtt5"
version = "0.8.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
num_enum = "^0.7.6"

[dependencies.pyo3]
version = "^0.29.2"
features = ["abi3-py311"]

[profile.release]
codegen-units = 1
lto = "fat"

[lints.clippy]
enum_variant_names = "allow"
too_many_arguments = "allow"
